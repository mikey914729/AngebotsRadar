<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Digitales ProspektHeft</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --bg-input: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-green: #30d158;
            --accent-red: #ff453a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .header { 
            text-align: left; 
            margin-bottom: 24px; 
            margin-top: 10px;
        }
        
        .header h2 {
            font-size: 34px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0;
        }

        .search-container { 
            max-width: 100%; 
            margin-bottom: 20px; 
        }

        .search-input { 
            width: 100%; 
            padding: 14px 20px; 
            font-size: 17px; 
            background: var(--bg-input);
            border: 1px solid #3a3a3c;
            border-radius: 14px; 
            color: var(--text-main);
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.2s ease;
        }

        .search-input:focus { 
            border-color: #0a84ff;
            background: #3a3a3c;
        }

        .buttons-container { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 12px;
            margin-bottom: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        .buttons-container::-webkit-scrollbar { display: none; }

        .btn { 
            padding: 10px 18px; 
            border: 1px solid #2c2c2e; 
            border-radius: 20px; 
            background: var(--bg-card); 
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap;
            transition: all 0.2s ease; 
        }

        .btn.active { 
            background: var(--text-main); 
            color: var(--bg-main);
            border-color: var(--text-main);
        }

        #prospekt-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); 
            gap: 16px; 
            padding-bottom: 40px; 
        }

        .prospekt-card { 
            background: var(--bg-card); 
            padding: 14px; 
            border-radius: 16px; 
            border: 1px solid #2c2c2e;
            text-align: left; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-height: 290px;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }
        
        .prospekt-card:active {
            transform: scale(0.98);
        }

        .image-wrapper { 
            width: 100%; 
            height: 110px; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .image-wrapper svg { 
            width: 85px; 
            height: 85px; 
            display: block; 
        }

        .market-badge { 
            font-size: 11px; 
            font-weight: 700; 
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        
        .badge-aldi { background: rgba(10, 132, 255, 0.15); color: #0a84ff; }
        .badge-penny { background: rgba(255, 69, 58, 0.15); color: #ff453a; }
        .badge-edeka { background: rgba(255, 214, 10, 0.15); color: #ffd60a; }
        .badge-netto { background: rgba(48, 209, 88, 0.15); color: #30d158; }
        .badge-rossmann { background: rgba(255, 159, 10, 0.15); color: #ff9f0a; }
        .badge-fressnapf { background: rgba(191, 90, 242, 0.15); color: #bf5af2; }
        .badge-baumarkt { background: rgba(142, 142, 147, 0.2); color: #aeaeac; }
        .badge-default { background: #2c2c2e; color: var(--text-main); }

        .product-title { 
            font-size: 15px; 
            font-weight: 600; 
            line-height: 1.3;
            margin-bottom: 8px; 
            min-height: 40px; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #f2f2f7;
        }

        .price-container { 
            margin-top: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start;
            gap: 1px; 
        }

        .old-price { 
            font-size: 12px; 
            color: var(--text-muted); 
            text-decoration: line-through; 
        }

        .price { 
            font-size: 20px; 
            color: var(--accent-green); 
            font-weight: 700; 
            letter-spacing: -0.3px;
        }
        
        .action-indicator {
            font-size: 11px;
            color: var(--accent-red);
            font-weight: bold;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Prospekte</h2>
        <p>Angebote aus Wolnzach (85283)</p>
    </div>

    <div class="search-container">
        <input type="text" id="suche" class="search-input" placeholder="Nach Produkten suchen..." onkeyup="sucheAngebote()">
    </div>

    <div class="buttons-container">
        <button class="btn active" onclick="filtereMarkt('alle')">Alle</button>
        <button class="btn" onclick="filtereMarkt('ALDI SÜD')">ALDI SÜD</button>
        <button class="btn" onclick="filtereMarkt('EDEKA')">EDEKA</button>
        <button class="btn" onclick="filtereMarkt('Netto')">Netto</button>
        <button class="btn" onclick="filtereMarkt('PENNY')">PENNY</button>
        <button class="btn" onclick="filtereMarkt('ROSSMANN')">ROSSMANN</button>
        <button class="btn" onclick="filtereMarkt('Fressnapf')">Fressnapf</button>
        <button class="btn" onclick="filtereMarkt('Sonderpreis Baumarkt')">Baumarkt</button>
    </div>

    <div id="prospekt-container"></div>
