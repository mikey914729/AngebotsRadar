<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Digitales ProspektHeft</title>
    <!-- Wir laden das professionelle Layout von außen, damit der Code ultrakurz bleibt -->
    <link rel="stylesheet" href="https://github.io" onerror="this.href='https://jsdelivr.net'">
</head>
<body>

    <div class="header" style="text-align: center; margin-bottom: 20px;">
        <h2>Mein Digitales ProspektHeft</h2>
        <p>Preise vergleichen in Wolnzach (85283)</p>
        <input type="text" id="suche" placeholder="Nach Spezi, Schokolade... suchen" oninput="sucheAngebote()" style="width: 100%; max-width: 500px; padding: 12px; border-radius: 25px; border: 2px solid #ddd; outline: none;">
    </div>

    <div class="buttons-container" id="btn-box" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px;">
        <button class="btn active" onclick="filtereMarkt('alle', this)">Preisvergleich</button>
        <button class="btn" onclick="filtereMarkt('ALDI SÜD', this)">ALDI SÜD</button>
        <button class="btn" onclick="filtereMarkt('EDEKA', this)">EDEKA</button>
        <button class="btn" onclick="filtereMarkt('Netto', this)">Netto</button>
        <button class="btn" onclick="filtereMarkt('PENNY', this)">PENNY</button>
        <button class="btn" onclick="filtereMarkt('ROSSMANN', this)">ROSSMANN</button>
        <button class="btn" onclick="filtereMarkt('Fressnapf', this)">Fressnapf</button>
        <button class="btn" onclick="filtereMarkt('Sonderpreis Baumarkt', this)">Baumarkt</button>
    </div>

    <div id="prospekt-container"></div>

    <script>
        let alleAngebote = [];
        let aktuellerMarkt = 'alle';

        const symbole = {"apple":"🍎","potato":"🥔","fish":"🐟","lemon":"🍋","onion":"🧅","cookies":"🍪","chocolate":"🍫","butter":"🧈","milkshake":"🥛","laundry":"🧺","dogfood":"🍖","screws":"⚙️","clothes":"👕","default":"🛒"};
        const namen = {"apple":"Äpfel","potato":"Kartoffeln","fish":"Fisch","lemon":"Zitronen","onion":"Zwiebeln","cookies":"Gebäck","chocolate":"Schokolade","butter":"Molkerei","milkshake":"Getränke","laundry":"Drogerie","dogfood":"Tierfutter","screws":"Werkzeug","clothes":"Kleidung","default":"Sonstiges"};

        fetch('daten.json').then(r => r.json()).then(d => { alleAngebote = d; sucheAngebote(); }).catch(e => console.error(e));

        function sucheAngebote() {
            const txt = document.getElementById('suche').value.toLowerCase().trim();
            let liste = aktuellerMarkt === 'alle' ? alleAngebote : alleAngebote.filter(i => i.markt_name === aktuellerMarkt);
            let gefundene = liste.filter(i => i.produkt_name.toLowerCase().includes(txt) || (txt === 'apfel' && i.produkt_name.toLowerCase().includes('äpfel')));
            const container = document.getElementById('prospekt-container');
            container.innerHTML = '';

            if (gefundene.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7f8c8d; margin-top: 40px; font-weight: bold;">Keine Angebote gefunden.</p>';
                return;
            }

            if (aktuellerMarkt === 'alle') {
                let map = {};
                gefundene.forEach(i => {
                    let b = i.bild || 'default';
                    if (!map[b]) map[b] = [];
                    map[b].push(i);
                });

                Object.keys(map).forEach(key => {
                    let block = document.createElement('div');
                    block.className = 'vergleich-block';
                    block.innerHTML = `<div class="vergleich-titel"><span class="symbol">${symbole[key] || '🛒'}</span><span>Vergleich: ${namen[key] || 'Produkte'}</span></div>`;
                    let grid = document.createElement('div');
                    grid.className = 'maerkte-grid';
                    let minP = Math.min(...map[key].map(a => parseFloat(a.preis.replace('€','').replace(',','.').trim())).filter(p => !isNaN(p)));

                    map[key].forEach(a => {
                        let pNum = parseFloat(a.preis.replace('€','').replace(',','.').trim());
                        let isBest = (!isNaN(pNum) && pNum === minP && map[key].length > 1);
                        grid.innerHTML += `<div class="markt-card ${isBest ? 'best' : ''}">${isBest ? '<span class="badge">Bester Preis</span>' : ''}<div class="markt-label">📍 ${a.markt_name}</div><div class="product-title">${a.produkt_name}</div><div class="price-box"><div class="old-price">${a.alter_preis}</div><div class="price ${isBest ? 'grun' : ''}">${a.preis}</div><div class="gueltigkeit">Diese Woche</div></div></div>`;
                    });
                    block.appendChild(grid);
                    container.appendChild(block);
                });
            } else {
                let grid = document.createElement('div');
                grid.className = 'maerkte-grid';
                gefundene.forEach(a => {
                    grid.innerHTML += `<div class="markt-card"><div style="font-size:32px; margin-bottom:4px;">${symbole[a.bild] || '🛒'}</div><div class="markt-label">📍 ${a.markt_name}</div><div class="product-title">${a.produkt_name}</div><div class="price-box"><div class="old-price">${a.alter_preis}</div><div class="price">${a.preis}</div><div class="gueltigkeit">Diese Woche</div></div></div>`;
                });
                container.appendChild(grid);
            }
        }

        function filtereMarkt(markt, btn) {
            aktuellerMarkt = markt;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sucheAngebote();
        }
    </script>
</body>
</html>
