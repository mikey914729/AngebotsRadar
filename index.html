<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngebotsRadar - 85283</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { color: #d93838; text-align: center; margin-bottom: 5px; }
        .update-info { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; border-top: 4px solid #d93838; }
        .card h3 { margin: 0 0 10px 0; color: #333; font-size: 1.2em; }
        .market-name { color: #007bff; font-weight: bold; font-size: 0.9em; margin-bottom: 15px; }
        .price-tag { font-size: 1.6em; color: #d93838; font-weight: bold; margin: 10px 0 5px 0; }
        .old-price { font-size: 0.9em; color: #777; text-decoration: line-through; margin-bottom: 10px; }
        .badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; background: #ffebeb; color: #d93838; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        .times { font-size: 0.8em; color: #555; background: #f9f9f9; padding: 8px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔥 AngebotsRadar: Wolnzach und Region 🔥</h1>
    <div class="update-info" id="timestamp">Lade aktuelle Angebote für 85283...</div>

    <div class="grid" id="markets-container"></div>

    <script>
        const dataUrl = './daten.json';

        async function ladeLiveDaten() {
            try {
                const response = await fetch(dataUrl);
                if (!response.ok) throw new Error('Fehler beim Laden');
                
                const angebote = await response.json();
                const container = document.getElementById('markets-container');
                container.innerHTML = '';

                if (angebote.length === 0) {
                    container.innerHTML = '<p>Aktuell keine Angebote für diese Region verfügbar.</p>';
                    return;
                }

                angebote.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="badge">DEAL</span>
                        <h3>${item.name}</h3>
                        <div class="market-name">📍 ${item.strasse}</div>
                        <div class="price-tag">${item.preis}</div>
                        <div class="old-price">${item.alter_preis ? item.alter_preis : '&nbsp;'}</div>
                        <div class="times">⏳ ${item.oeffnungszeiten}</div>
                    `;
                    container.appendChild(card);
                });

                const jetzt = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('timestamp').innerText = `Angebots-Zusammenfassung für Geisenfeld (Stand: ${jetzt} Uhr)`;

            } catch (fehler) {
                console.error(fehler);
                document.getElementById('timestamp').innerText = 'Fehler beim Laden der Live-Angebote.';
            }
        }

        ladeLiveDaten();
    </script>
</body>
</html>
