<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Digitales ProspektHeft</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #000000; color: #ffffff; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; }
        .search-container { max-width: 500px; margin: 0 auto 20px auto; text-align: center; }
        .search-input { width: 100%; padding: 12px 20px; font-size: 16px; border: 1px solid #3a3a3c; border-radius: 25px; box-sizing: border-box; background: #1c1c1e; color: #ffffff; outline: none; }
        .search-input:focus { border-color: #0a84ff; }
        .buttons-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: 1px solid #2c2c2e; border-radius: 20px; background: #1c1c1e; color: #ffffff; font-weight: bold; cursor: pointer; }
        .btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }
        #prospekt-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 10px; }
        .prospekt-card { background: #1c1c1e; padding: 15px; border-radius: 12px; border: 1px solid #2c2c2e; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 290px; }
        .image-wrapper { width: 100%; height: 120px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .image-wrapper svg { width: 90px; height: 90px; display: block; margin: 0 auto; }
        .market-label { font-size: 12px; color: #8e8e93; font-weight: bold; margin-bottom: 5px; }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; min-height: 40px; display: flex; align-items: center; justify-content: center; color: #ffffff; }
        .price-container { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .old-price { font-size: 13px; color: #8e8e93; text-decoration: line-through; font-weight: normal; }
        .price { font-size: 19px; color: #30d158; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Prospekte</h2>
        <p>Angebote aus Wolnzach (85283)</p>
    </div>

    <div class="search-container">
        <input type="text" id="suche" class="search-input" placeholder="Nach Produkten suchen..." onkeyup="sucheAngebote()">
    </div>

    <div class="buttons-container">
        <button class="btn active" onclick="filtereMarkt('alle')">alle Prospekte</button>
        <button class="btn" onclick="filtereMarkt('ALDI SÜD')">ALDI SÜD</button>
        <button class="btn" onclick="filtereMarkt('EDEKA')">EDEKA</button>
        <button class="btn" onclick="filtereMarkt('Netto')">Netto</button>
        <button class="btn" onclick="filtereMarkt('PENNY')">PENNY</button>
        <button class="btn" onclick="filtereMarkt('ROSSMANN')">ROSSMANN</button>
        <button class="btn" onclick="filtereMarkt('Fressnapf')">Fressnapf</button>
        <button class="btn" onclick="filtereMarkt('Sonderpreis Baumarkt')">Baumarkt</button>
    </div>

    <div id="prospekt-container"></div>

    <script>
        let alleAngebote = [];
        let aktuellerMarkt = 'alle';

        const svgBilder = {
            "apple": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#2c1414"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🍎</text></svg>`,
            "potato": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#2c2514"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🥔</text></svg>`,
            "fish": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#14222c"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🐟</text></svg>`,
            "lemon": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#2c2c14"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🍋</text></svg>`,
            "onion": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#24142c"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🧅</text></svg>`,
            "cookies": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#2c1420"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🍪</text></svg>`,
            "chocolate": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#231b15"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🍫</text></svg>`,
            "butter": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#2a2c14"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🧈</text></svg>`,
            "milkshake": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#142c2c"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🥛</text></svg>`,
            "laundry": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#22142c"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🧺</text></svg>`,
            "dogfood": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#231b15"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🍖</text></svg>`,
            "screws": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1f2426"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">⚙️</text></svg>`,
            "clothes": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#192c14"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">👕</text></svg>`,
            "default": `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#222222"/><text y="50" x="50" font-size="55" dominant-baseline="central" text-anchor="middle">🛒</text></svg>`
        };

        async function ladeDaten() {
            try {
                const response = await fetch('daten.json');
                alleAngebote = await response.json();
                sucheAngebote();
            } catch (error) {
                console.error("Fehler beim Laden der JSON-Daten:", error);
            }
        }

        function sucheAngebote() {
            let eingabe = document.getElementById('suche').value.toLowerCase().trim();
            let liste = alleAngebote;
            if (aktuellerMarkt !== 'alle') {
                liste = alleAngebote.filter(item => item.markt_name === aktuellerMarkt);
            }

            let gefundene = liste.filter(item => {
                let namePasst = item.produkt_name.toLowerCase().includes(eingabe);
                if (eingabe === "apfel" || eingabe === "äpfel") {
                    return item.produkt_name.toLowerCase().includes("apfel") || item.produkt_name.toLowerCase().includes("äpfel");
                }
                return namePasst;
            });

            baueProspektAnsicht(gefundene);
        }

        function baueProspektAnsicht(liste) {
            const container = document.getElementById('prospekt-container');
            container.innerHTML = '';
            
            if (liste.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#8e8e93; margin-top: 30px;">Keine Angebote gefunden.</p>';
                return;
            }

            liste.forEach(item => {
                const card = document.createElement('div');
                card.className = 'prospekt-card';
                
                let svgCode = svgBilder[item.bild] || svgBilder["default"];
                let alterPreisHtml = item.alter_preis ? `<span class="old-price">${item.alter_preis}</span>` : '';

                card.innerHTML = `
                    <div class="image-wrapper">${svgCode}</div>
                    <div class="market-label">📍 ${item.markt_name}</div>
                    <div class="product-title">${item.produkt_name}</div>
                    <div class="price-container">
                        ${alterPreisHtml}
                        <span class="price">${item.preis}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtereMarkt(markt) {
            aktuellerMarkt = markt;
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            sucheAngebote();
        }

        ladeDaten();
    </script>
</body>
</html>
