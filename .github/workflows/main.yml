name: ProspektBot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Startet automatisch jeden Tag um 06:00 Uhr

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Multi-Markt-Pipeline ausführen
      run: python3 update_offers.py

    - name: Änderungen speichern und pushen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add daten_aldi.json daten.json || echo "Keine Dateien vorhanden"
        git commit -m "Update Aldi Angebote aus PDF" || echo "Keine Änderungen zum Committen"
        git push origin main
