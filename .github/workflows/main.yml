name: AngebotsRadar Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install requests

      - name: Daten für 85283 sammeln
        run: |
          python update_offers.py

      - name: Änderungen automatisch speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AngebotsRadar: Daten für 85283 aktualisiert [skip ci]"
          file_pattern: 'angebote_85283.json'
