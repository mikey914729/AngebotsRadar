name: ProspektBot

on:
  schedule:
    - cron: '0 1 * * 1' # Läuft automatisch jeden Montag um 01:00 Uhr nachts
  workflow_dispatch: # Das schaltet den grauen Button für den manuellen Start frei!

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Run multi-market pipeline
        run: python update_offers.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add daten.json daten_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Live-Prospekt-Datenbank vollautomatisch aktualisiert" && git push)
